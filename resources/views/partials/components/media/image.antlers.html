<figure class="{{ wrapperClass }}">
  <picture>
    {{# Blank out the variant hidden by CSS at this width, so eager loading doesn't fetch it #}}
    {{ if blankFrom }}<source media="(min-width: {{ blankFrom }})" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">{{ /if }}
    {{ if blankBelow }}<source media="(max-width: {{ blankBelow }})" srcset="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">{{ /if }}
    {{ if (sizes | in_array('2xl')) }}
      <source media="(min-width: 1280px)" srcset="{{ glide:image preset="{{ preset ? '2xl-{{ preset }}-webp' : '2xl-webp' }}" }} 1x, {{ glide:image preset="{{ preset ? '2xl-{{ preset }}-webp' : '2xl-webp' }}" dpr="1.4285" }} 2x" type="image/webp">
      <source media="(min-width: 1280px)" srcset="{{ glide:image preset="{{ preset ? '2xl-{{ preset }}' : '2xl' }}" }} 1x, {{ glide:image preset="{{ preset ? '2xl-{{ preset }}' : '2xl' }}" dpr="1.4285" }} 2x" type="image/jpeg">
    {{ /if }}
    {{ if (sizes | in_array('xl')) }}
      <source media="(min-width: 1024px)" srcset="{{ glide:image preset="{{ preset ? 'xl-{{ preset }}-webp' : 'xl-webp' }}" }} 1x, {{ glide:image preset="{{ preset ? 'xl-{{ preset }}-webp' : 'xl-webp' }}" dpr="1.6666" }} 2x" type="image/webp">
      <source media="(min-width: 1024px)" srcset="{{ glide:image preset="{{ preset ? 'xl-{{ preset }}' : 'xl' }}" }} 1x, {{ glide:image preset="{{ preset ? 'xl-{{ preset }}' : 'xl' }}" dpr="1.6666" }} 2x" type="image/jpeg">
    {{ /if }}
    {{ if (sizes | in_array('lg')) }}
      <source media="(min-width: 768px)" srcset="{{ glide:image preset="{{ preset ? 'lg-{{ preset }}-webp' : 'lg-webp' }}" }} 1x, {{ glide:image preset="{{ preset ? 'lg-{{ preset }}-webp' : 'lg-webp' }}" dpr="1.875" }} 2x" type="image/webp">
      <source media="(min-width: 768px)" srcset="{{ glide:image preset="{{ preset ? 'lg-{{ preset }}' : 'lg' }}" }} 1x, {{ glide:image preset="{{ preset ? 'lg-{{ preset }}' : 'lg' }}" dpr="1.875" }} 2x" type="image/jpeg">
    {{ /if }}
    <source srcset="{{ glide:image preset="{{ preset ? 'md-{{ preset }}-webp' : 'md-webp' }}" }} 1x, {{ glide:image preset="{{ preset ? 'md-{{ preset }}-webp' : 'md-webp' }}" dpr="2" }} 2x" />
    <img 
      src="{{ glide:image preset="{{ preset ? 'md-{{ preset }}' : 'md' }}" }}" 
      alt="{{ alt ? alt : image:alt }}" 
      title="{{ alt ? alt : image:alt }}" 
      height="{{ image:height }}" 
      width="{{ image:width }}"
      class="block {{ class ?? '' }}"
      loading="{{ loading ?? 'lazy' }}"
      {{ if loading == 'eager' }}fetchpriority="high"{{ /if }}>
  </picture>
</figure>
